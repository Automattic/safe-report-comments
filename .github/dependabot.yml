version: 2

updates:
  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      actions:
        patterns:
          - "*"
    labels:
      - "dependencies"
    reviewers:
      - "Automattic/vip-plugins"
    commit-message:
      prefix: "Actions"
      include: "scope"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7

  # Composer (PHP dev dependencies)
  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "tuesday"
    groups:
      dev-dependencies:
        patterns:
          - "automattic/*"
          - "dealerdirect/*"
          - "php-parallel-lint/*"
          - "phpcompatibility/*"
          - "phpunit/*"
          - "squizlabs/*"
          - "wp-coding-standards/*"
          - "yoast/*"
    labels:
      - "dependencies"
    reviewers:
      - "Automattic/vip-plugins"
    commit-message:
      prefix: "Composer"
      include: "scope"
    open-pull-requests-limit: 5
    versioning-strategy: increase-if-necessary
    cooldown:
      default-days: 7
